<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			@import url("https://fonts.googleapis.com/css2?family=Meow+Script&family=Playwrite+GB+S:ital,wght@0,100..400;1,100..400&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap");

			#photoContainer {
				text-align: center;
				margin: 20px;
			}

			.photo {
				margin-bottom: 20px;
				border-radius: 10px;
				border: none;
				box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
				overflow: hidden;
			}

			.photo img {
				margin-top: 20px;
				max-width: 100%;
			}

			.photo-info {
				margin-top: 10px;
			}

			.photo-photographer {
				font-family: "Roboto", sans-serif;
				font-weight: 400;
				font-style: normal;
				font-size: 18px;
			}

			.like-btn {
				font-family: "Roboto", sans-serif;
				font-weight: 400;
				font-style: normal;
				width: 250px;
				background-color: pink;
				color: white;
				border: none;
				padding: 10px 20px;
				cursor: pointer;
				font-size: 16px;
				border-radius: 10px;
			}

			.like-btn:hover {
				background-color: red;
			}

			.like-info {
				font-family: "Roboto", sans-serif;
				font-weight: 400;
				font-style: normal;
				margin-top: 10px;
				font-size: 16px;
				margin-bottom: 10px;
			}

			.like-count span {
				font-family: "Roboto", sans-serif;
				font-size: 16px;
			}
		</style>
	</head>
	<body>
		<div id="photoContainer">
			<div class="photo">
				<img class="photo-random" alt="Random Photo" />
				<div class="photo-info">
					<p class="photo-photographer"></p>
				</div>
				<button class="like-btn">Like</button>
				<div class="like-info">Likes: <span class="like-count">0</span></div>
			</div>
		</div>
		<script src="./script.js"></script>
	</body>
</html>
